<!DOCTYPE html>

<title>JD Retailer Owner Access Generator</title>
<style>
body{font-family:Arial;background:#f4f4f4;margin:0;padding:20px}.card{max-width:620px;margin:auto;background:white;padding:20px;border-radius:16px}
input,button,textarea{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:10px}
button{background:#111;color:#fff;border:0;font-weight:bold}textarea{min-height:150px}
.note{font-size:12px;color:#666}h2{margin-top:0}

<body>
<div class="card">
<h2>JD Retailer Owner Access</h2>
<p>Generate an access code only for customers you approve.</p>
<label>Customer Mobile Number</label>
<input id="phone" placeholder="10-digit mobile number">
<label>Access Validity</label>
<select id="days" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc">
<option value="30">30 Days</option>
<option value="90">90 Days</option>
<option value="180">180 Days</option>
<option value="365">1 Year</option>
<option value="0">No Expiry</option>
</select>
<button onclick="generate()">Generate Access Code</button>
<textarea id="out" readonly placeholder="Access code will appear here"></textarea>
<button onclick="copyCode()">Copy Code</button>
<p class="note"><b>Keep this file private.</b> It contains the owner signing key. Do not send this admin file to customers.</p>
</div>

function b64url(bytes){
  let s=''; bytes.forEach(b=>s+=String.fromCharCode(b));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function pemToBytes(pem){
  const b64=pem.replace(/-----[^-]+-----/g,'').replace(/\s/g,'');
  const bin=atob(b64); return Uint8Array.from(bin,c=>c.charCodeAt(0));
}
async function generate(){
  const phone=document.getElementById('phone').value.replace(/\D/g,'').slice(-10);
  const days=parseInt(document.getElementById('days').value);
  if(phone.length!==10){alert('Enter valid 10-digit number');return;}
  const exp=days===0?0:(Date.now()+days*24*60*60*1000);
  const payload=JSON.stringify({phone,exp});
  const payloadBytes=new TextEncoder().encode(payload);
  const key=await crypto.subtle.importKey(
    'pkcs8',
    pemToBytes(PRIVATE_KEY_PEM),
    {name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},
    false,
    ['sign']
  );
  const sig=new Uint8Array(await crypto.subtle.sign('RSASSA-PKCS1-v1_5',key,payloadBytes));
  document.getElementById('out').value=b64url(payloadBytes)+'.'+b64url(sig);
}
async function copyCode(){
  const v=document.getElementById('out').value;
  if(!v)return;
  await navigator.clipboard.writeText(v);
  alert('Access code copied');
}
